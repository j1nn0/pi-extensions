name: Pi Compatibility

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: Baseline Pi compatibility (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - pi-input-lock
          - pi-footer
        include:
          - package: pi-input-lock
            filter: '@j1nn0/pi-input-lock'
            path: packages/pi-input-lock
            pi_ai_version: '1.0.0'
            pi_coding_agent_version: '1.0.0'
            pi_tui_version: '1.0.0'
          - package: pi-footer
            filter: '@j1nn0/pi-footer'
            path: packages/pi-footer
            pi_ai_version: '1.0.0'
            pi_coding_agent_version: '1.0.0'
            pi_tui_version: '1.0.0'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: pnpm
      - name: Prepare compatibility copy
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/compat-min"
          mkdir -p "$RUNNER_TEMP/compat-min"
          cp -a "$GITHUB_WORKSPACE/." "$RUNNER_TEMP/compat-min/"
      - name: Install minimum supported Pi dependencies
        working-directory: ${{ runner.temp }}/compat-min
        run: >-
          pnpm --filter '${{ matrix.filter }}' add -D
          @earendil-works/pi-ai@${{ matrix.pi_ai_version }}
          @earendil-works/pi-coding-agent@${{ matrix.pi_coding_agent_version }}
          @earendil-works/pi-tui@${{ matrix.pi_tui_version }}
          --config.minimumReleaseAge=0
      - name: Report resolved Pi versions
        working-directory: ${{ runner.temp }}/compat-min/${{ matrix.path }}
        run: |
          set -euo pipefail
          pnpm list --depth 0
          node -e 'const fs = require("node:fs"); for (const name of ["@earendil-works/pi-ai", "@earendil-works/pi-coding-agent", "@earendil-works/pi-tui"]) { const version = JSON.parse(fs.readFileSync(`node_modules/${name}/package.json`, "utf8")).version; console.log(`${name}@${version}`); }'
      - name: Typecheck
        working-directory: ${{ runner.temp }}/compat-min/${{ matrix.path }}
        env:
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: '0'
        run: pnpm check
      - name: Test
        working-directory: ${{ runner.temp }}/compat-min/${{ matrix.path }}
        env:
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: '0'
        run: pnpm test

  latest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Latest Pi compatibility (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - pi-input-lock
          - pi-footer
        include:
          - package: pi-input-lock
            filter: '@j1nn0/pi-input-lock'
            path: packages/pi-input-lock
          - package: pi-footer
            filter: '@j1nn0/pi-footer'
            path: packages/pi-footer
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Prepare compatibility copy
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/compat-latest"
          mkdir -p "$RUNNER_TEMP/compat-latest"
          cp -a "$GITHUB_WORKSPACE/." "$RUNNER_TEMP/compat-latest/"
      - name: Install latest Pi dependencies
        working-directory: ${{ runner.temp }}/compat-latest
        run: >-
          pnpm --filter '${{ matrix.filter }}' add -D
          @earendil-works/pi-ai@latest
          @earendil-works/pi-coding-agent@latest
          @earendil-works/pi-tui@latest
          --config.minimumReleaseAge=0
      - name: Report resolved Pi versions
        working-directory: ${{ runner.temp }}/compat-latest/${{ matrix.path }}
        run: |
          set -euo pipefail
          pnpm list --depth 0
          node -e 'const fs = require("node:fs"); for (const name of ["@earendil-works/pi-ai", "@earendil-works/pi-coding-agent", "@earendil-works/pi-tui"]) { const version = JSON.parse(fs.readFileSync(`node_modules/${name}/package.json`, "utf8")).version; console.log(`${name}@${version}`); }'
      - name: Typecheck
        working-directory: ${{ runner.temp }}/compat-latest/${{ matrix.path }}
        env:
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: '0'
        run: pnpm check
      - name: Test
        working-directory: ${{ runner.temp }}/compat-latest/${{ matrix.path }}
        env:
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: '0'
        run: pnpm test
